name: MeowSave Android Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keystore & Environment
        run: |
          # 1. Try to restore debug.keystore from debug.keystore.base64 if present
          if [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # 2. If debug.keystore is still missing or empty, generate a valid debug keystore with keytool
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "debug.keystore not found. Generating a valid debug keystore via keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Verify debug.keystore exists and is valid
          if [ -f "debug.keystore" ]; then
            echo "debug.keystore is ready:"
            ls -lh debug.keystore
          else
            echo "Error: Failed to create or restore debug.keystore!"
            exit 1
          fi

          # 4. Ensure .env exists for the secrets gradle plugin
          if [ ! -f ".env" ]; then
            echo "Creating empty .env file..."
            touch .env
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found in app/build/outputs/apk/debug"
            exit 1
          fi
          echo "APK successfully generated at: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowSave-v1.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
